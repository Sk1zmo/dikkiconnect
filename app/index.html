<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0B0E15" />
    <meta
      name="description"
      content="DikkiConnect — intercity parcel delivery using the empty boot space of cars already making your route, plus cost-shared carpooling."
    />
    <title>DikkiConnect — Deliver Anything, Anywhere</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='11' fill='%230b0e15'/%3E%3Cpath d='M3 11.5h9.8L23 24 12.8 36.5H3L13.2 24Z' fill='%237ba5ff'/%3E%3Cpath d='M21.5 6h11.9L45.5 24 33.4 42H21.5L33.6 24Z' fill='%23ffffff'/%3E%3C/svg%3E"
    />
    <!-- Absolute, not relative: on a nested route "./manifest.webmanifest"
         resolves against that path and gets the SPA fallback HTML instead. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DikkiConnect" />

    <!-- Inter is served from our own origin, not Google's.
         Two reasons, and the second is the important one:
           · no render-blocking request to a third party on first paint;
           · the APK bundles these files, so the app renders in its real
             typeface offline. A webfont loaded over the network silently
             degrades to system sans the moment the phone loses signal, which
             is exactly when a delivery app gets used.
         One variable file covers 400–900, so weight costs nothing extra. -->
    <link
      rel="preload"
      href="/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Offline support + home-screen install. Skipped on file:// where service
      // workers are unavailable (the single-file build is already self-contained).
      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {})
        })
      }
    </script>
  </body>
</html>
