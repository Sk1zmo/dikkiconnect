<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0B0E15" />
    <meta
      name="description"
      content="WayPool — intercity parcel delivery in the empty boot space of cars already making your route, plus cost-shared carpooling."
    />
    <title>WayPool — Move more. Together.</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cdefs%3E%3ClinearGradient id='t' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='#1d5cf2'/%3E%3Cstop offset='1' stop-color='#0e3aa8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='48' height='48' rx='11' fill='url(#t)'/%3E%3Cg transform='translate(9.6 9.6) scale(0.6)'%3E%3Cpath d='M36 9.5H14.5a5.75 5.75 0 0 0 0 11.5h17a5.75 5.75 0 0 1 0 11.5H9' fill='none' stroke='#fff' stroke-width='7.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='39.5' cy='38.5' r='4.25' fill='#96b8ff'/%3E%3C/g%3E%3C/svg%3E"
    />
    <!-- Absolute, not relative: on a nested route "./manifest.webmanifest"
         resolves against that path and gets the SPA fallback HTML instead. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WayPool" />

    <!-- Inter is served from our own origin, not Google's.
         Two reasons, and the second is the important one:
           · no render-blocking request to a third party on first paint;
           · the APK bundles these files, so the app renders in its real
             typeface offline. A webfont loaded over the network silently
             degrades to system sans the moment the phone loses signal, which
             is exactly when a delivery app gets used.
         One variable file covers 400–900, so weight costs nothing extra. -->
    <link
      rel="preload"
      href="/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- The landing screen's artwork. Requested here, in parallel with the
         bundle, so it is already decoded when the opening lifts. -->
    <link rel="preload" href="/hero.webp" as="image" type="image/webp" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Offline support + home-screen install. Skipped on file:// where service
      // workers are unavailable (the single-file build is already self-contained).
      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {})
        })
      }
    </script>
  </body>
</html>
